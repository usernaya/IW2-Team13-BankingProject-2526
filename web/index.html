<!DOCTYPE html>
<html lang="nl">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>SEPA Payments — PingFin</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="css/style.css">
</head>

<body>



   <div class="card">
      <div class="card-title">Betaling versturen</div>

      <!-- Van rekening -->
      <div class="field">
         <label>Van rekening</label>
         <div class="select-wrap">
            <select>
            </select>
         </div>
      </div>

      <!-- Bedrag + IBAN -->
      <div class="row">
         <div class="field">
            <label>Bedrag (EUR)</label>
            <div class="amount-wrap">
               <input type="number" id="amount" placeholder="€" value="10" max="500">
            </div>
         </div>
         <div class="field">
            <label>IBAN begunstigde</label>
            <input type="text" id="iban" >
         </div>
      </div>


      <!-- Foutmelding -->
      <div class="error-box" id="error-box">
         <div class="error-text">
         </div>
      </div>

      <!-- Knoppen -->
      <div class="actions">
         <button class="btn-primary" type="button">Betaling sturen</button>
         <button class="btn-ghost" type="button">10 willekeurige orders</button>
      </div>

      <hr>

   </div>

</body>

</html>

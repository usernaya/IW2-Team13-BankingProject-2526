<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPH Bank - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">
  <main class="login-panel">
    <section class="login-panel__brand">
      <div>
        <img src="img/rph_logo.png" alt="RPH logo">
        <h1>RPH Banking</h1>
      </div>

      <div class="login-metrics">
        <div class="login-metric">
          <strong>24/7</strong>
          <span>Reliable</span>
        </div>
        <div class="login-metric">
          <strong>Fully</strong>
          <span>Professional</span>
        </div>
        <div class="login-metric">
          <strong>100%</strong>
          <span>Human</span>
        </div>
      </div>
    </section>

    <section class="login-panel__form">
      <div>
        <h2>Log in</h2>
        <p>Gebruik de demo-gegevens om het dashboard te openen.</p>
      </div>

      <form action="app.html" method="get" class="form-grid">
        <label class="full-width">
          ID
          <input type="text" name="client-id" value="admin" pattern="admin" required>
        </label>

        <label class="full-width">
          Password
          <input type="password" name="password" value="1234" pattern="1234" required>
        </label>

        <button class="button full-width" type="submit">Log In</button>
      </form>

      <div class="login-links">
        <a href="app.html">Dashboard</a>
        <a href="create-account.html">Create account</a>
        <a href="overview.html">Overview</a>
      </div>
    </section>
  </main>
</body>

</html>

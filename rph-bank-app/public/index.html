<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPH Bank - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">
  <main class="login-panel">
    <img src="img/rph_logo.png" alt="RPH logo">
    <h1>RPH Banking</h1>
    <p>Use the demo credentials to open the dashboard.</p>

    <form action="app.html" method="get" class="form-grid">
      <label class="full-width">
        ID
        <input type="text" name="client-id" value="admin" pattern="admin" required>
      </label>

      <label class="full-width">
        Password
        <input type="password" name="password" value="1234" pattern="1234" required>
      </label>

      <button class="button full-width" type="submit">Log In</button>
    </form>
  </main>
</body>

</html>
